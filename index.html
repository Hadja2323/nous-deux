{n:'Défis et gages',d:'Chaque couple, à tour de rôle, reçoit un défi. Certains se font tout de suite avec un chrono, d\'autres en privé, plus tard. Défi accepté : 500 points. Chaque couple peut jouer son joker et passer, sans pénalité.'}
];

/* ---------- état local ---------- */
/* identifiant propre à chaque onglet : permet aussi de tester à deux sur le même téléphone */
const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
let myId=sess.get('nd-id'); if(!myId){myId=Math.random().toString(36).slice(2,12);sess.set('nd-id',myId)}
let lastState=0,retries=0,rejoinTimer=null;
const bn=document.createElement('div');bn.className='bn';bn.textContent='Reconnexion à la partie…';document.body.appendChild(bn);
const banner=on=>{bn.style.display=on?'block':'none'};
let G=null, isHost=false, conn=null, peer=null, H=null, lastKey='', joinArgs=null, leaving=false, wake=null;
const keepAwake=async()=>{try{wake=await navigator.wakeLock.request('screen')}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(isHost||conn)keepAwake();watch()});
/* surveillance : l'animateur relance sa connexion, les joueurs vérifient qu'ils reçoivent bien la partie */
function watch(){
  if(leaving)return;
  if(isHost&&H){if(!peer||peer.destroyed)hostPeer(H.code);else if(peer.disconnected){try{peer.reconnect()}catch(e){}}}
  else if(!isHost&&joinArgs&&G){if(conn&&conn.open){try{conn.send({type:'ping'})}catch(e){}}if(!conn||!conn.open||Date.now()-lastState>15000)retry()}
}
setInterval(watch,4000);

/* ---------- moteur de l'animateur ---------- */
const members=c=>H.players.filter(p=>p.couple===c);
const couplesOf=ps=>[...new Set(ps.map(p=>p.couple))].sort((a,b)=>a-b);
function pub(){
  const games=(H.plan||[]).filter(s=>s.t!=='intro');
  return {code:H.code,phase:H.phase,players:H.players.map(p=>({id:p.id,name:p.name,couple:p.couple,online:p.online})),scores:H.scores,step:H.step||null,
    num:H.plan?H.plan.slice(0,H.si+1).filter(s=>s.t!=='intro').length:0,total:games.length,
    left:H.deadline?Math.max(0,(H.deadline-Date.now())/1000):0,span:H.span||T,answered:Object.keys(H.ans||{}),results:H.results||{},endTip:H.endTip||'',host:myId,themes:H.themes,len:H.len,tour:H.tour};
}
function hSend(){const g=pub();H.players.forEach(p=>{if(p.conn&&p.conn.open){try{p.conn.send({type:'state',g})}catch(e){}}});recv(g)}
function hostCreate(name,couple){
  isHost=true;leaving=false;H=null;hostPeer(String(Math.floor(1000+Math.random()*9000)),name,couple);
  wait('Création de la partie…');
}
function hostPeer(code,name,couple){
  if(peer)try{peer.destroy()}catch(e){}
  const pr=peer=new Peer(PREFIX+code,{debug:0});
  pr.on('open',()=>{
    if(!H){let th=[];try{th=JSON.parse(store.get('nd-themes')||'[]').filter(k=>THEMES[k])}catch(e){}
      H={code,phase:'lobby',players:[{id:myId,name,couple,online:true,self:true}],scores:{},themes:th.length?th:['complicite','cuisine'],len:store.get('nd-len')||'normal',tour:loadTour()}}
    hSend();
  });
  pr.on('error',e=>{
    if(pr!==peer||leaving)return;
    if(e.type==='unavailable-id'){if(!H)return hostPeer(String(Math.floor(1000+Math.random()*9000)),name,couple);setTimeout(()=>{if(pr===peer&&!leaving&&H)hostPeer(H.code)},3000);return}
    if(!H)fail('Impossible de créer la partie. Vérifiez votre connexion internet puis réessayez.');
  });
  pr.on('disconnected',()=>{if(pr===peer&&!leaving)setTimeout(()=>{try{if(pr===peer&&pr.disconnected&&!pr.destroyed)pr.reconnect()}catch(e){}},1000)});
  pr.on('connection',c=>{
    c.on('data',d=>hData(c,d));
    c.on('close',()=>{const p=H&&H.players.find(p=>p.conn===c);if(p){p.online=false;p.conn=null;hSend();hCheck()}});
  });
}
function hData(c,d){
  if(!H||!d)return;
  if(d.type==='join'){
    const id=String(d.id||'').slice(0,40),name=String(d.name||'').trim().slice(0,16)||'Joueur',cp=+d.couple;
    let p=H.players.find(p=>p.id===id);
    if(p){p.conn=c;p.online=true}
    else{
      if(H.phase!=='lobby')return c.send({type:'err',msg:'La partie a déjà commencé. Demandez à l\'animateur de relancer une partie.'});
      if(!(cp>=1&&cp<=4))return;
      if(members(cp).length>=2)return c.send({type:'err',msg:'Le couple '+cp+' est déjà complet. Choisissez un autre numéro de couple.'});
      H.players.push({id,name,couple:cp,conn:c,online:true});
    }
    hSend();
  }else if(d.type==='answer'){const p=H.players.find(p=>p.conn===c);if(p)hAnswer(p.id,+d.i)}
  else if(d.type==='ping'){const p=H.players.find(p=>p.conn===c);if(p){try{c.send({type:'state',g:pub()})}catch(e){}}}
}
function hAnswer(id,i){
  if(H.phase!=='ask'||H.ans[id]||!(i>=0&&i<4))return;
  H.ans[id]={i,ms:Date.now()-H.qStart};hSend();hCheck();
}
function hCheck(){if(H&&H.phase==='ask'&&H.players.every(p=>H.ans[p.id]||!p.online))hReveal()}
function hValid(){const cs=couplesOf(H.players);return cs.length>=1&&cs.every(c=>members(c).length===2)}
function hStart(){
  const cs=couplesOf(H.players);H.scores={};cs.forEach(c=>H.scores[c]=0);H.saved=false;
  const sel=H.themes.length?H.themes:['complicite'],L=LENS[H.len]||LENS.normal;
  const pool=f=>shuffle(sel.flatMap(k=>THEMES[k][f].map(q=>Object.assign({},q,{th:THEMES[k].label}))));
  const k=pool('know').slice(0,L.k),w=pool('wave').slice(0,L.w),d=pool('defis').slice(0,L.d*cs.length);
  const rounds=[];if(k.length)rounds.push(0);if(w.length)rounds.push(1);if(d.length)rounds.push(2);
  const R=rounds.length;H.plan=[];
  rounds.forEach((r,ri)=>{
    H.plan.push({t:'intro',r,ri,R});
    if(r===0)k.forEach((q,j)=>H.plan.push({t:'know',r,ri,R,q,targets:Object.fromEntries(cs.map(c=>[c,members(c)[j%2].id]))}));
    if(r===1)w.forEach(q=>H.plan.push({t:'wave',r,ri,R,q}));
    if(r===2)d.forEach((q,j)=>H.plan.push({t:'heart',r,ri,R,q,c:cs[j%cs.length]}));
  });
  const tp=shuffle(TIPS.filter(x=>!x.th||sel.includes(x.th)).map(x=>x.t));let ti=0;
  H.plan.forEach(st=>{st.tip=tp[ti++%tp.length]});H.endTip=tp[ti%tp.length];
  H.si=-1;hNext();
}
function loadTour(){try{return JSON.parse(store.get('nd-tournoi')||'{}')||{}}catch(e){return {}}}
function saveTour(){couplesOf(H.players).forEach(c=>{const ms=members(c),key=ms.map(p=>p.name.toLowerCase()).sort().join('|');const t=H.tour[key]||(H.tour[key]={label:ms.map(p=>p.name).join(' & '),pts:0,games:0});t.pts+=H.scores[c]||0;t.games++});store.set('nd-tournoi',JSON.stringify(H.tour))}
function hTheme(k,on){H.themes=H.themes.filter(x=>x!==k);if(on)H.themes.push(k);H.themes.sort((a,b)=>TKEYS.indexOf(a)-TKEYS.indexOf(b));store.set('nd-themes',JSON.stringify(H.themes));hSend()}
function hLen(v){if(LENS[v]){H.len=v;store.set('nd-len',v);hSend()}}
function hLobby(){clearTimeout(H.timer);H.phase='lobby';H.step=null;H.plan=null;H.si=0;H.deadline=0;hSend()}
function hResetTour(){H.tour={};store.set('nd-tournoi','{}');hSend()}
function hNext(){
  clearTimeout(H.timer);H.deadline=0;H.si++;H.ans={};H.results={};
  const st=H.plan[H.si];H.step=st||null;
  if(!st){H.phase='end';if(!H.saved){saveTour();H.saved=true}}
  else if(st.t==='intro')H.phase='intro';
  else if(st.t==='heart')H.phase='heart';
  else{H.phase='ask';H.span=T;H.qStart=Date.now();H.deadline=H.qStart+T*1000;H.timer=setTimeout(hReveal,T*1000+400)}
  hSend();
}
function hReveal(){
  if(H.phase!=='ask')return;clearTimeout(H.timer);H.deadline=0;const st=H.step;
  couplesOf(H.players).forEach(c=>{
    const [A,B]=members(c);let ids;
    if(st.t==='know'){const t=st.targets[c];ids=[t,A.id===t?B.id:A.id]}else ids=[A.id,B.id];
    const x=H.ans[ids[0]],y=H.ans[ids[1]],ok=!!(x&&y&&x.i===y.i);
    const pts=!ok?0:st.t==='know'?Math.round(500+500*Math.max(0,1-y.ms/(T*1000))):1000;
    H.scores[c]+=pts;H.results[c]={ok,pts,ids,ans:[x?x.i:-1,y?y.i:-1]};
  });
  H.phase='reveal';hSend();
}
function hChrono(){const d=(H.step&&H.step.q.s)||CHRONO;H.span=d;H.deadline=Date.now()+d*1000;hSend()}
function hHeart(ok){if(ok)H.scores[H.step.c]+=500;hNext()}
function hRemove(id){if(H.phase!=='lobby'||id===myId)return;const p=H.players.find(p=>p.id===id);if(p&&p.conn)try{p.conn.send({type:'err',msg:'L\'animateur vous a retiré de la partie. Vous pouvez la rejoindre à nouveau.'})}catch(e){}H.players=H.players.filter(p=>p.id!==id);hSend()}

/* ---------- joueur ---------- */
function join(code,name,couple,silent){
  isHost=false;leaving=false;joinArgs={code,name,couple};
  if(peer)try{peer.destroy()}catch(e){}
  let got=false;const to=setTimeout(()=>{if(!got){got=true;silent?retry():fail('Impossible de rejoindre la partie. Vérifiez le code et la connexion internet.')}},15000);
  const pr=peer=new Peer({debug:0});
  pr.on('open',()=>{
    const c=conn=pr.connect(PREFIX+code,{reliable:true,serialization:'json'});
    c.on('open',()=>c.send({type:'join',id:myId,name,couple}));
    c.on('data',d=>{if(!d)return;if(d.type==='state'){got=true;clearTimeout(to);retries=0;lastState=Date.now();sess.set('nd-join',JSON.stringify(joinArgs));recv(d.g)}else if(d.type==='err'){got=true;clearTimeout(to);leaving=true;banner(false);fail(d.msg)}});
    c.on('close',()=>{if(c===conn&&!leaving){clearTimeout(to);got=true;retry()}});
  });
  pr.on('error',e=>{
    if(pr!==peer||leaving)return;clearTimeout(to);got=true;
    if(silent||G)return retry();
    fail(e.type==='peer-unavailable'?'Aucune partie ne correspond à ce code. Vérifiez les 4 chiffres auprès de l\'animateur.':'Problème de connexion. Réessayez dans un instant.');
  });
  if(silent)banner(true);else wait('Connexion à la partie '+esc(code)+'…');
}
function retry(){
  if(leaving||isHost||!joinArgs||rejoinTimer)return;
  if(++retries>24){banner(false);return lost()}
  banner(true);
  rejoinTimer=setTimeout(()=>{rejoinTimer=null;if(!leaving)join(joinArgs.code,joinArgs.name,joinArgs.couple,true)},2500);
}
function answer(i){if(isHost)hAnswer(myId,i);else if(conn&&conn.open)conn.send({type:'answer',i})}

/* ---------- affichage ---------- */
function paint(html,key){const k=key||'';app.innerHTML=html;if(k!==lastKey){app.firstElementChild&&app.firstElementChild.classList.add('enter');window.scrollTo(0,0)}lastKey=k}
function wait(msg){paint(`<div class="center tc">${HERO}<p class="big" style="font-size:26px">${msg}</p></div>`,'wait')}
function fail(msg){G=null;paint(`<div class="center tc">${HERO}<div class="err">${esc(msg)}</div><button class="btn" id="home">Retour à l'accueil</button></div>`,'fail');$('#home').onclick=()=>{leave();home()}}
function lost(){paint(`<div class="center tc">${HERO}<p class="big" style="font-size:28px">Connexion perdue</p><p class="mute">L'animateur a peut-être fermé la page ou son téléphone s'est mis en veille.</p><button class="btn" id="re">Se reconnecter</button><button class="btn ghost" id="home">Accueil</button></div>`,'lost');$('#re').onclick=()=>{retries=0;join(joinArgs.code,joinArgs.name,joinArgs.couple)};$('#home').onclick=()=>{leave();home()}}
function leave(){sess.set('nd-join','');leaving=true;clearTimeout(rejoinTimer);rejoinTimer=null;joinArgs=null;banner(false);try{peer&&peer.destroy()}catch(e){}peer=null;conn=null;H=null;G=null;isHost=false}

function tipsPage(){
  const groups=[['Pour tous les couples',TIPS.filter(x=>!x.th)],...TKEYS.map(k=>[THEMES[k].label,TIPS.filter(x=>x.th===k)]).filter(g=>g[1].length)];
  paint(`<div><h1 style="font-size:34px;margin:8px 0 6px">Conseils de couple</h1><p class="mute small">Ils s'affichent aussi au fil de la partie, selon les thèmes choisis.</p>${groups.map(([l,a])=>`<p class="small mute" style="margin:18px 0 0">${l}</p>${a.map(x=>tipCard(x.t).replace('<b>Conseil de couple</b><br>','')).join('')}`).join('')}<button class="btn" id="back">Retour</button></div>`,'tips');

  <form id="f"><label for="nm">Votre prénom</label><input id="nm" maxlength="16" autocomplete="off" value="${nm}" required>
  <label for="cp">Votre couple</label>${sel}<p class="small mute" style="margin:6px 0 0">Les deux membres d'un même couple choisissent le même numéro.</p>

  <button class="btn" type="submit" id="bj">Rejoindre la partie</button><button class="btn ghost" type="button" id="bc">Créer une nouvelle partie</button></form>
  <button class="btn ghost" type="button" id="bt">Lire les conseils de couple</button>
  <ul class="rules"><li>Une seule personne crée la partie : elle devient l'animateur et joue aussi.</li><li>Les autres ouvrent cette même page, tapent le code et rejoignent.</li><li>L'animateur choisit les thèmes : complicité, cuisine, coquin, fantasmes, jeux de rôle.</li><li>Les points vont au couple et s'additionnent partie après partie : idéal pour un week-end.</li></ul></div>`,'home');
  const vals=()=>{const n=$('#nm').value.trim(),c=+$('#cp').value;if(!n){$('#nm').focus();return null}store.set('nd-name',n);store.set('nd-couple',c);return {n,c}};
  $('#f').onsubmit=e=>{e.preventDefault();const v=vals();if(!v)return;const code=$('#code').value.trim();if(!/^\d{4}$/.test(code)){$('#code').focus();return}keepAwake();join(code,v.n,v.c)};

const nameOf=id=>{const p=G.players.find(p=>p.id===id);return p?p.name:'?'};
const mates=c=>G.players.filter(p=>p.couple===c);
const cname=c=>mates(c).map(p=>esc(p.name)).join(' & ')||('Couple '+c);
const fill=(s,m)=>s.replace(/\{(\w)\}/g,(_,k)=>esc(m[k]??''));
const opts=list=>'<div class="opts">'+list.map((o,i)=>`<button class="opt o${i}" data-i="${i}">${SH[i]}<span>${o}</span></button>`).join('')+'</div>';
function board(){
  const cs=Object.keys(G.scores).map(Number).sort((a,b)=>G.scores[b]-G.scores[a]),m=Math.max(1000,...cs.map(c=>G.scores[c])),me=myCouple();
  return '<div class="panel">'+cs.map(c=>`<div class="row"><span>${cname(c)}${c===me?' <span class="small mute">(vous)</span>':''}</span><span class="pts">${G.scores[c]}</span><div class="bar"><i style="width:${G.scores[c]/m*100}%;background:${c===me?'var(--rose)':'var(--vio)'}"></i></div></div>`).join('')+'</div>';

const myCouple=()=>{const p=G.players.find(p=>p.id===myId);return p?p.couple:0};
const top=()=>{const s=G.step;return `<div class="top"><span>Manche ${s.ri+1} · ${ROUNDS[s.r].n}</span><span>${G.num}/${G.total}</span></div>`};
const fmt=x=>{const t=Math.ceil(x);return t>=60?Math.floor(t/60)+':'+String(t%60).padStart(2,'0'):String(t)};
const tipCard=t=>t?`<div class="tip"><b>Conseil de couple</b><br>${esc(t)}</div>`:'';
const thTag=q=>q&&q.th?`<span class="tag" style="margin-left:6px">${esc(q.th)}</span>`:'';

function recv(g){G=g;G._at=Date.now();banner(false);render()}

  if(ph==='lobby'){

    <p class="small mute" style="margin:18px 0 6px">Thèmes de cette partie${isHost?' (touchez pour choisir)':''}</p><div class="themes">${TKEYS.map(k=>{const on=(G.themes||[]).includes(k),t=THEMES[k];return isHost?`<button class="tg" data-th="${k}" aria-pressed="${on}">${t.label}${t.adulte?' <small>18+</small>':''}</button>`:(on?`<span class="tg" aria-pressed="true">${t.label}</span>`:'')}).join('')}</div>

    if(isHost){$('#go').onclick=hStart;$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(link);$('#copy').textContent='Lien copié !'}catch(e){$('#copy').textContent=link}};app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>hRemove(b.dataset.rm));app.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>hTheme(b.dataset.th,b.getAttribute('aria-pressed')!=='true'));$('#len').onchange=e=>hLen(e.target.value);if($('#rst'))$('#rst').onclick=()=>{if($('#rst').dataset.c){hResetTour()}else{$('#rst').dataset.c=1;$('#rst').textContent='Confirmer la remise à zéro'}}}
    return;
  }
  if(ph==='intro'){
    const r=ROUNDS[G.step.r];
    paint(`<div class="center tc"><span class="tag">Manche ${G.step.ri+1} sur ${G.step.R}</span><h1 style="margin:14px 0">${r.n}</h1><p>${r.d}</p>${G.step.ri?board()+tipCard(G.step.tip):''}${hostBtn('C\'est parti','go')}${waitHost('L\'animateur va lancer la manche.')}</div>`,key);
    if(isHost)$('#go').onclick=hNext;return;
  }
  if(ph==='ask'){
    const s=G.step,ms=mates(c);let qt,o,tag;
    if(s.t==='know'){const q=s.q,t=s.targets[c],m={n:nameOf(t)};o=q.o.map(x=>fill(x,m));
      if(t===myId){qt=fill(q.me,m);tag='Réponds sur toi, en secret'}else{qt=fill(q.them,m);tag='Devine la réponse de '+esc(m.n)}}
    else{const q=s.q,m={a:ms[0]?.name,b:ms[1]?.name};o=q.o.map(x=>fill(x,m));qt=fill(q.q,m);tag='Réponds en secret pour votre couple'}
    const timer=`<div class="timer"><i id="bar"></i></div><div class="count" id="cnt">${Math.ceil(G.left)}</div>`;
    if(G.answered.includes(myId)){
      const rest=G.players.filter(p=>p.online&&!G.answered.includes(p.id)).map(p=>esc(p.name));
      paint(`${top()}<div class="center tc"><p class="big" style="font-size:30px">Réponse envoyée</p><p class="mute">On attend : ${rest.join(', ')||'…'}</p>${timer}</div>`,key+'w');
    }else{paint(`${top()}<div class="tc"><span class="tag">${tag}</span>${thTag(s.q)}</div><div class="q">${qt}</div>${timer}${opts(o)}`,key);app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}
    tickNow();return;
  }
  if(ph==='reveal'){
    const s=G.step,res=G.results[c]||{ok:false,pts:0,ids:[],ans:[-1,-1]},ms=mates(c);let o,qt,v;
    if(s.t==='know'){const q=s.q,m={n:nameOf(res.ids[0])};o=q.o.map(x=>fill(x,m));qt=fill(q.them,m);v=res.ok?'Bien vu !':'Raté !'}
    else{const q=s.q,m={a:ms[0]?.name,b:ms[1]?.name};o=q.o.map(x=>fill(x,m));qt=fill(q.q,m);v=res.ok?'Même longueur d\'onde !':'Pas tout à fait…'}
    const card=(k,lab)=>{const i=res.ans[k];return i<0?`<div class="opt on"><span><small>${lab}</small><br>Pas de réponse</span></div>`:`<div class="opt o${i}">${SH[i]}<span><small>${lab}</small><br>${o[i]}</span></div>`};
    const l0=s.t==='know'?'Réponse de '+esc(nameOf(res.ids[0])):esc(nameOf(res.ids[0])),l1=s.t==='know'?'Pronostic de '+esc(nameOf(res.ids[1])):esc(nameOf(res.ids[1]));
    paint(`${top()}<div class="center"><div class="verdict ${res.ok?'good':'bad'}">${v}</div><p class="pts tc">+${res.pts} points</p><div class="q" style="font-size:20px;margin-bottom:6px">${qt}</div><div class="two">${card(0,l0)}${card(1,l1)}</div>${res.ok?'':'<p class="mute small tc">Expliquez-vous chacun en une phrase.</p>'}${board()}${tipCard(s.tip)}${hostBtn('Question suivante','go')}${waitHost()}</div>`,key);
    if(isHost)$('#go').onclick=hNext;return;
  }
  if(ph==='heart'){
    const s=G.step,q=s.q,mine=s.c===c,running=G.left>0;
    const info=q.prive?`<div class="panel tc" style="padding:12px"><b>Gage privé</b><br><span class="mute">À réaliser ${esc(q.prive)}, rien que vous deux.</span></div>`:'';
    paint(`${top()}<div class="center tc"><span class="tag">${mine?'À vous deux !':'Au tour de '+cname(s.c)}</span>${thTag(q)}<div class="q" style="margin-top:18px">${q.q}</div>${info}
    ${q.s?`<div class="timer"><i id="bar"></i></div><div class="count" id="cnt">${fmt(running?G.left:q.s)}</div>${running?'':hostBtn('Lancer le chrono ('+fmt(q.s)+')','chrono','ghost')}`:''}
    <p class="mute small">${q.prive?(mine?'Acceptez le gage : les autres comptent sur votre honnêteté !':'Ce gage se fera en privé.'):(mine?'Les autres vous regardent, sans juger.':'Regardez et écoutez sans juger.')}</p>
    ${tipCard(s.tip)}${hostBtn(q.prive?'Gage accepté · +500':'Défi relevé · +500','ok')}${hostBtn('Joker : on passe','skip','ghost')}${waitHost(mine?'Vous pouvez dire « joker » à l\'animateur pour passer, sans pénalité.':'L\'animateur valide le défi.')}</div>`,key+(running?'r':''));
    if(isHost){$('#ok').onclick=()=>hHeart(true);$('#skip').onclick=()=>hHeart(false);if($('#chrono'))$('#chrono').onclick=hChrono}
    tickNow();return;
  }
  if(ph==='end'){
    const cs=Object.keys(G.scores).map(Number),best=Math.max(...cs.map(x=>G.scores[x])),w=cs.filter(x=>G.scores[x]===best);
    paint(`<div class="center tc">${HERO}<span class="tag">Fin de la partie</span><h1 style="margin:12px 0">${w.length>1?'Égalité au sommet !':'Bravo '+cname(w[0])+' !'}</h1>${board()}${tourPanel()}${tipCard(G.endTip)}<p style="margin-top:18px">Le vrai score, c'est tout ce que vous venez de vous dire. Ce soir, répétez-vous chacun la phrase qui vous a le plus touché.</p>${hostBtn('Nouvelle partie (changer les thèmes)','again')}${waitHost('L\'animateur peut relancer une partie.')}<button class="btn ghost" id="home">Quitter</button></div>`,key);
    if(isHost)$('#again').onclick=hLobby;$('#home').onclick=()=>{leave();home()};
  }
}
function tickNow(){
  if(!G)return;const rem=Math.max(0,G.left-(Date.now()-G._at)/1000),span=G.span||T;
  const c=$('#cnt'),b=$('#bar');if(c&&(G.phase==='ask'||G.left))c.textContent=fmt(rem);if(b)b.style.width=(G.phase==='ask'||G.left?rem/span*100:100)+'%';
}
setInterval(tickNow,200);
if(typeof Peer==='undefined')paint(`<div class="center tc">${HERO}<div class="err">Le module de connexion n'a pas pu se charger. Vérifiez la connexion internet puis rechargez la page.</div></div>`,'nopeer');
else{let sj=null;try{sj=JSON.parse(sess.get('nd-join')||'null')}catch(e){}if(sj&&sj.code)join(sj.code,sj.name,sj.couple);else home()}
}
</script>
